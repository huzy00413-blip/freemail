<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 账号管理 - freemail</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f7fa; color: #1a1a2e;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .loading { text-align: center; color: #888; }
    .spinner {
      width: 36px; height: 36px; border: 3px solid #e0e0e0;
      border-top-color: #4f6ef7; border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box { display: none; text-align: center; padding: 40px 20px; color: #666; max-width: 400px; }
    .error-box h3 { margin-bottom: 10px; color: #f56c6c; }
    .error-box p { font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
    .error-box a { color: #4f6ef7; }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>正在进入 AI 账号管理...</div>
  </div>
  <div class="error-box" id="errorBox">
    <h3>AI 服务未配置</h3>
    <p>请先在 Render 部署 aBaiFreeGPT 服务，并在 Worker 中配置 ABAI_SERVICE_URL。</p>
    <a href="/">← 返回邮箱</a>
  </div>

<script>
(async function () {
  try {
    // 检查登录状态
    const sessResp = await fetch('/api/session', { credentials: 'include' });
    if (!sessResp.ok) {
      location.replace('/html/login.html?redirect=' + encodeURIComponent('/html/abai.html'));
      return;
    }

    // 检查 AI 服务是否可用（通过代理访问 /api/abai/api/health）
    const cfgResp = await fetch('/api/abai/api/health', { credentials: 'include' });
    if (!cfgResp.ok) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('errorBox').style.display = 'block';
      return;
    }

    // 直接跳转到代理后的 aBaiFreeGPT 首页
    location.replace('/api/abai/');
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('errorBox').style.display = 'block';
  }
})();
</script>
</body>
</html>
