<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChatGPT 换绑邮箱 - freemail</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container { max-width: 680px; margin: 0 auto; }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px;
    }
    .header h1 { font-size: 22px; font-weight: 700; }
    .header a { color: #4f6ef7; text-decoration: none; font-size: 14px; }
    .header a:hover { text-decoration: underline; }

    .card {
      background: #fff; border-radius: 14px; padding: 24px 28px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }
    .card h2 {
      font-size: 16px; font-weight: 600; color: #333;
      margin-bottom: 18px; padding-bottom: 12px;
      border-bottom: 1px solid #f0f0f0;
      display: flex; align-items: center; gap: 8px;
    }
    .card h2 .step-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border-radius: 50%;
      background: #4f6ef7; color: #fff; font-size: 12px; font-weight: 700;
    }

    .form-group { margin-bottom: 16px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-group label {
      display: block; font-size: 13px; font-weight: 600; color: #555;
      margin-bottom: 6px;
    }
    .form-group input, .form-group select {
      width: 100%; padding: 10px 14px; border: 1px solid #dcdfe6;
      border-radius: 8px; font-size: 14px; outline: none;
      transition: border-color 0.2s; background: #fff;
      font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus { border-color: #4f6ef7; }
    .form-group input:read-only { background: #f5f7fa; cursor: not-allowed; color: #888; }
    .form-group .hint { font-size: 12px; color: #999; margin-top: 4px; line-height: 1.5; }
    .form-group .hint code {
      background: #f5f7fa; padding: 1px 6px; border-radius: 3px;
      font-size: 11px; font-family: "Cascadia Code", "Fira Code", monospace;
    }

    .recv-box {
      background: #f8f9fb; border: 1px solid #e8eaed; border-radius: 8px;
      padding: 12px 14px; margin-top: 8px;
    }
    .recv-box .recv-label { font-size: 12px; color: #888; margin-bottom: 4px; }
    .recv-box .recv-url {
      font-family: "Cascadia Code", "Fira Code", monospace;
      font-size: 12px; color: #4f6ef7; word-break: break-all;
    }

    .btn {
      display: inline-block; padding: 11px 28px; border: none;
      border-radius: 8px; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s, background 0.2s;
      font-family: inherit;
    }
    .btn-primary { background: #4f6ef7; color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { background: #a0b0f0; cursor: not-allowed; }
    .btn-danger { background: #f56c6c; color: #fff; }
    .btn-danger:hover { opacity: 0.9; }
    .btn-danger:disabled { background: #f8b4b4; cursor: not-allowed; }

    /* 步骤指示器 */
    .steps {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; position: relative;
    }
    .steps::before {
      content: ''; position: absolute; top: 15px; left: 10%; right: 10%;
      height: 2px; background: #e8eaed; z-index: 0;
    }
    .step {
      display: flex; flex-direction: column; align-items: center;
      position: relative; z-index: 1; flex: 1;
    }
    .step-dot {
      width: 30px; height: 30px; border-radius: 50%;
      background: #fff; border: 2px solid #dcdfe6;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #bbb;
      transition: all 0.3s;
    }
    .step.active .step-dot {
      border-color: #4f6ef7; background: #4f6ef7; color: #fff;
      box-shadow: 0 0 0 4px rgba(79,110,247,0.15);
    }
    .step.done .step-dot {
      border-color: #67c23a; background: #67c23a; color: #fff;
    }
    .step.done .step-dot::after { content: '✓'; }
    .step.done .step-dot span { display: none; }
    .step-label {
      font-size: 11px; color: #999; margin-top: 6px; text-align: center;
      white-space: nowrap;
    }
    .step.active .step-label { color: #4f6ef7; font-weight: 600; }
    .step.done .step-label { color: #67c23a; }

    .status-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 4px;
      font-size: 12px; font-weight: 600;
    }
    .badge-created { background: #fdf6ec; color: #e6a23c; }
    .badge-running { background: #ecf5ff; color: #409eff; }
    .badge-waiting_code { background: #f0f0ff; color: #7c5cfc; }
    .badge-success { background: #f0f9eb; color: #67c23a; }
    .badge-failed { background: #fef0f0; color: #f56c6c; }
    .badge-cancelled { background: #f4f4f5; color: #909399; }
    .badge-expired { background: #fdf6ec; color: #e6a23c; }

    .progress-bar {
      height: 4px; background: #f0f0f0; border-radius: 2px;
      overflow: hidden; margin-bottom: 16px;
    }
    .progress-fill {
      height: 100%; background: #4f6ef7; border-radius: 2px;
      transition: width 0.5s ease; width: 0%;
    }

    .log-area {
      background: #1e1e2e; color: #cdd6f4; padding: 14px;
      border-radius: 8px; font-family: "Cascadia Code", "Fira Code", monospace;
      font-size: 12px; line-height: 1.7; max-height: 260px;
      overflow-y: auto; white-space: pre-wrap; word-break: break-all;
    }

    .result-box {
      margin-top: 14px; padding: 14px; border-radius: 8px;
      background: #f0f9eb; border: 1px solid #e1f3d8;
    }
    .result-box.fail { background: #fef0f0; border-color: #fde2e2; }
    .result-box .row { margin-bottom: 8px; font-size: 13px; }
    .result-box .row:last-child { margin-bottom: 0; }
    .result-box .row span:first-child { color: #888; display: inline-block; min-width: 90px; }

    .action-row { margin-top: 16px; text-align: right; }

    .not-enabled { text-align: center; padding: 40px 20px; color: #999; }
    .not-enabled h3 { margin-bottom: 10px; color: #666; }

    .info-banner {
      background: #ecf5ff; border: 1px solid #d9ecff; border-radius: 8px;
      padding: 10px 14px; font-size: 12px; color: #409eff; line-height: 1.6;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔄 ChatGPT 换绑邮箱</h1>
      <a href="/">← 返回邮箱</a>
    </div>

    <div id="notEnabled" class="card not-enabled" style="display:none">
      <h3>换绑功能未启用</h3>
      <p style="font-size:13px" id="notEnabledReason">请配置 REBIND_SERVICE_URL 后重新部署。</p>
    </div>

    <div id="mainContent">
      <!-- 第一段：账号信息 -->
      <div class="card" id="cardAccount">
        <h2><span class="step-num">1</span> 账号信息</h2>
        <div class="info-banner">
          旧邮箱仅用于登录验证，换绑验证码只会发送到<strong>新邮箱</strong>，旧邮箱无需接收邮件。
        </div>
        <div class="form-group">
          <label>旧邮箱（ChatGPT 登录邮箱）</label>
          <input type="email" id="oldEmail" placeholder="old@example.com" autocomplete="off" />
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="password" placeholder="ChatGPT 账号密码" autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label>TOTP 密钥（Base32）</label>
          <input type="text" id="totpSecret" placeholder="JBSWY3DPEHPK3PXP" autocomplete="off" />
          <div class="hint">两步验证的密钥，非 6 位动态码。提交后密码和密钥将自动清空。</div>
        </div>
      </div>

      <!-- 第二段：目标邮箱 -->
      <div class="card" id="cardTarget">
        <h2><span class="step-num">2</span> 目标邮箱</h2>
        <div class="form-group">
          <label>新邮箱（选择 freemail 中已有的邮箱）</label>
          <select id="newEmailSelect">
            <option value="">加载邮箱列表中...</option>
          </select>
          <div class="hint">管理员可选择全部邮箱，普通用户仅可选择自己的邮箱。</div>
        </div>
        <div class="form-group" id="recvGroup" style="display:none">
          <label>新邮箱收信地址（自动生成，只读）</label>
          <div class="recv-box">
            <div class="recv-label">验证码将发送至此邮箱，由 freemail 自动接收：</div>
            <div class="recv-url" id="recvUrl"></div>
          </div>
        </div>
        <div class="form-group" id="manualNewEmailGroup" style="display:none">
          <label>或手动输入新邮箱地址</label>
          <input type="email" id="newEmailManual" placeholder="new@yourdomain.com" autocomplete="off" />
        </div>
        <div class="action-row">
          <button class="btn btn-primary" id="submitBtn" onclick="startRebind()">开始换绑</button>
        </div>
      </div>

      <!-- 第三段：任务状态 -->
      <div class="card" id="cardStatus" style="display:none">
        <h2><span class="step-num">3</span> 任务状态</h2>
        <div class="steps" id="stepsIndicator">
          <div class="step" data-step="created">
            <div class="step-dot"><span>1</span></div>
            <div class="step-label">已创建</div>
          </div>
          <div class="step" data-step="running">
            <div class="step-dot"><span>2</span></div>
            <div class="step-label">登录中</div>
          </div>
          <div class="step" data-step="waiting_code">
            <div class="step-dot"><span>3</span></div>
            <div class="step-label">等待验证码</div>
          </div>
          <div class="step" data-step="success">
            <div class="step-dot"><span>4</span></div>
            <div class="step-label">完成</div>
          </div>
        </div>
        <div class="status-row">
          <span>当前状态：</span>
          <span id="statusBadge" class="badge badge-created">created</span>
          <span id="taskIdLabel" style="font-size:12px;color:#999;margin-left:auto"></span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="log-area" id="logArea">等待提交...</div>
        <div id="resultArea"></div>
        <div class="action-row" id="actionRow" style="display:none">
          <button class="btn btn-danger" id="cancelBtn" onclick="cancelTask()">取消任务</button>
        </div>
      </div>
    </div>
  </div>

<script>
let pollTimer = null;
let currentTaskId = null;
let currentSession = null;
let mailboxList = [];
const TERMINAL_STATUSES = new Set(['success', 'failed', 'cancelled', 'expired']);

const STEP_ORDER = ['created', 'running', 'waiting_code', 'success'];
const STEP_PROGRESS = { created: 10, running: 40, waiting_code: 70, success: 100, failed: 100, cancelled: 100, expired: 100 };

async function checkAuth() {
  try {
    const r = await fetch('/api/session', { credentials: 'include' });
    if (!r.ok) {
      const redirect = encodeURIComponent('/html/rebind.html' + window.location.search);
      window.location.replace('/html/login.html?redirect=' + redirect);
      return false;
    }
    currentSession = await r.json();
    if (currentSession.role === 'guest' || currentSession.role === 'mailbox') {
      document.getElementById('mainContent').style.display = 'none';
      document.getElementById('notEnabled').style.display = 'block';
      document.getElementById('notEnabledReason').textContent = '当前身份无权使用换绑功能。';
      return false;
    }
    return true;
  } catch (_) { window.location.replace('/html/login.html'); return false; }
}

async function checkEnabled() {
  try {
    const r = await fetch('/api/rebind/config', { credentials: 'include' });
    if (r.ok) {
      const d = await r.json();
      if (!d.enabled) {
        document.getElementById('mainContent').style.display = 'none';
        document.getElementById('notEnabled').style.display = 'block';
        if (d.reason) document.getElementById('notEnabledReason').textContent = d.reason;
        return false;
      }
    }
  } catch (_) {}
  return true;
}

async function loadMailboxes() {
  const select = document.getElementById('newEmailSelect');
  try {
    const r = await fetch('/api/mailboxes?limit=500', { credentials: 'include' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    mailboxList = (d.list || []).filter(m => m.address);
    if (!mailboxList.length) {
      select.innerHTML = '<option value="">暂无可用邮箱，请先创建邮箱</option>';
      select.disabled = true;
      return;
    }
    select.innerHTML = '<option value="">请选择新邮箱...</option>' +
      mailboxList.map(m => `<option value="${escapeHtml(m.address)}">${escapeHtml(m.address)}</option>`).join('');

    // 从 URL 参数自动选中
    const params = new URLSearchParams(window.location.search);
    const presetEmail = (params.get('new_email') || '').trim().toLowerCase();
    if (presetEmail) {
      const match = mailboxList.find(m => m.address.toLowerCase() === presetEmail);
      if (match) {
        select.value = match.address;
        onMailboxChange();
        // 非管理员：锁定选择（只能使用从邮箱列表带入的邮箱）
        if (currentSession && !currentSession.strictAdmin) {
          select.disabled = true;
          select.style.backgroundColor = '#f5f7fa';
          select.style.cursor = 'not-allowed';
        }
      } else if (currentSession && !currentSession.strictAdmin) {
        // 普通用户带入了无权访问的邮箱
        select.innerHTML = '<option value="">该邮箱不在您的可用列表中</option>';
        select.disabled = true;
      }
    }
  } catch (e) {
    select.innerHTML = '<option value="">邮箱列表加载失败</option>';
  }
}

function onMailboxChange() {
  const select = document.getElementById('newEmailSelect');
  const addr = select.value;
  const recvGroup = document.getElementById('recvGroup');
  if (addr) {
    recvGroup.style.display = 'block';
    document.getElementById('recvUrl').textContent = window.location.origin + '/rebind/inbox';
  } else {
    recvGroup.style.display = 'none';
  }
}

function log(msg) {
  const area = document.getElementById('logArea');
  const t = new Date().toLocaleTimeString();
  area.textContent += `[${t}] ${msg}\n`;
  area.scrollTop = area.scrollHeight;
}

function setStatus(status) {
  const badge = document.getElementById('statusBadge');
  badge.className = 'badge badge-' + status;
  badge.textContent = status;

  // 更新步骤指示器
  const steps = document.querySelectorAll('#stepsIndicator .step');
  const currentIdx = STEP_ORDER.indexOf(status);
  steps.forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (status === 'failed' || status === 'cancelled' || status === 'expired') {
      if (i < STEP_ORDER.indexOf('running')) el.classList.add('done');
    } else if (currentIdx >= 0) {
      if (i < currentIdx) el.classList.add('done');
      else if (i === currentIdx) el.classList.add('active');
    }
  });

  // 更新进度条
  const fill = document.getElementById('progressFill');
  fill.style.width = (STEP_PROGRESS[status] || 0) + '%';
  if (status === 'failed' || status === 'cancelled' || status === 'expired') {
    fill.style.background = '#f56c6c';
  } else if (status === 'success') {
    fill.style.background = '#67c23a';
  } else {
    fill.style.background = '#4f6ef7';
  }
}

function showCancelButton(show) {
  document.getElementById('actionRow').style.display = show ? 'block' : 'none';
}

async function startRebind() {
  const oldEmail = document.getElementById('oldEmail').value.trim();
  const password = document.getElementById('password').value;
  const totpSecret = document.getElementById('totpSecret').value.trim();
  const newEmail = (document.getElementById('newEmailSelect').value || document.getElementById('newEmailManual').value || '').trim().toLowerCase();

  if (!oldEmail || !password || !totpSecret || !newEmail) {
    alert('请填写所有必填字段'); return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '提交中...';

  document.getElementById('cardStatus').style.display = 'block';
  document.getElementById('logArea').textContent = '';
  document.getElementById('resultArea').innerHTML = '';
  setStatus('created');
  showCancelButton(false);
  log('正在提交换绑任务...');

  try {
    const r = await fetch('/api/rebind/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ old_email: oldEmail, password, totp_secret: totpSecret, new_email: newEmail })
    });
    const d = await r.json();
    if (!r.ok || !d.success) {
      throw new Error(d.error || '提交失败');
    }
    currentTaskId = d.task_id;
    document.getElementById('taskIdLabel').textContent = 'task: ' + currentTaskId.slice(0, 12) + '...';
    log('任务已提交，开始轮询状态...');
    showCancelButton(true);

    // 提交成功后立即清空敏感字段
    document.getElementById('password').value = '';
    document.getElementById('totpSecret').value = '';

    pollStatus(currentTaskId);
  } catch (e) {
    log('错误：' + e.message);
    setStatus('failed');
    btn.disabled = false; btn.textContent = '开始换绑';
    // 失败也清空敏感字段
    document.getElementById('password').value = '';
    document.getElementById('totpSecret').value = '';
  }
}

async function cancelTask() {
  if (!currentTaskId) return;
  const btn = document.getElementById('cancelBtn');
  btn.disabled = true; btn.textContent = '取消中...';
  log('正在取消任务...');
  try {
    const r = await fetch('/api/rebind/cancel/' + currentTaskId, {
      method: 'POST',
      credentials: 'include',
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '取消失败');
    log('任务已取消');
    setStatus(d.status || 'cancelled');
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    showCancelButton(false);
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('submitBtn').textContent = '开始换绑';
  } catch (e) {
    log('取消失败：' + e.message);
    btn.disabled = false; btn.textContent = '取消任务';
  }
}

async function pollStatus(taskId) {
  if (pollTimer) clearInterval(pollTimer);
  let attempts = 0;
  const maxAttempts = 150;

  pollTimer = setInterval(async () => {
    attempts++;
    if (attempts > maxAttempts) {
      clearInterval(pollTimer);
      pollTimer = null;
      log('轮询超时，请稍后手动刷新页面查看');
      showCancelButton(false);
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtn').textContent = '开始换绑';
      return;
    }
    try {
      const r = await fetch('/api/rebind/status/' + taskId, { credentials: 'include' });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || d.detail || ('HTTP ' + r.status));

      setStatus(d.status || 'unknown');

      if (d.status === 'running') {
        log('换绑进行中：正在登录旧邮箱...');
      } else if (d.status === 'waiting_code') {
        log('验证码已发送至新邮箱，等待 freemail 接收...');
      } else if (TERMINAL_STATUSES.has(d.status)) {
        clearInterval(pollTimer);
        pollTimer = null;
        showCancelButton(false);
        if (d.status === 'success') {
          log('换绑成功！');
          showResult(d, true);
        } else if (d.status === 'cancelled') {
          log('任务已取消');
        } else if (d.status === 'expired') {
          log('任务超时过期');
          showResult(d, false);
        } else {
          log('换绑失败：' + (d.error || d.message || '未知错误'));
          showResult(d, false);
        }
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('submitBtn').textContent = '开始换绑';
      }
    } catch (e) {
      log('查询状态出错：' + e.message);
    }
  }, 2000);
}

function showResult(d, success) {
  const area = document.getElementById('resultArea');
  if (success) {
    area.innerHTML = `
      <div class="result-box">
        <div class="row"><span>新邮箱：</span><span>${escapeHtml(d.session_email || d.new_email || '')}</span></div>
        <div class="row"><span>Access Token：</span><span>${escapeHtml(d.access_token_masked || '')}</span></div>
        <div class="row" style="font-size:11px;color:#999;margin-top:8px">
          完整 session / access_token 已在任务结束后从服务端删除，出于安全考虑不在此页面显示。
        </div>
      </div>`;
  } else {
    area.innerHTML = `
      <div class="result-box fail">
        <div class="row"><span>错误码：</span><span>${escapeHtml(d.code || '')}</span></div>
        <div class="row"><span>错误信息：</span><span>${escapeHtml(d.message || d.error || '')}</span></div>
      </div>`;
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 初始化
(async function init() {
  const authed = await checkAuth();
  if (!authed) return;
  const enabled = await checkEnabled();
  if (!enabled) return;

  document.getElementById('newEmailSelect').addEventListener('change', onMailboxChange);
  await loadMailboxes();
})();
</script>
</body>
</html>
