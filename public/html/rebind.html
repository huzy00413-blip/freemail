<!DOCTYPE html>
<html lang="zh-CN" class="precheck-hide">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>换绑邮箱 - iDing's临时邮箱</title>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/app-modal.css" />
  <script src="/js/theme-toggle.js"></script>
  <script src="/js/auth-guard.js" defer></script>
  <script>
    (function(){
      fetch('/api/session', { headers: { 'Cache-Control': 'no-cache' } })
        .then(r => r.ok ? r.json() : Promise.reject('unauth'))
        .then(s => {
          if (s && s.user){
            try{ document.documentElement.classList.remove('precheck-hide'); }catch(_){ }
            return;
          }
          location.replace('/');
        })
        .catch(() => {
          if (window.AuthGuard) { window.AuthGuard.goLoading('/html/rebind.html', '正在校验登录…'); }
          else { location.replace('/templates/loading.html?redirect=%2Fhtml%2Frebind.html'); }
        });
    })();
  </script>
  <style>
    .precheck-hide body{ visibility: hidden !important; }
    .rebind-container { max-width: 720px; margin: 0 auto; padding: 24px; }
    .rebind-section { background: var(--bg-card, #fff); border: 1px solid var(--border-color, #e5e7eb); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    .rebind-section-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .rebind-section-title .step-num { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--primary, #3b82f6); color: #fff; font-size: 13px; }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary, #6b7280); }
    .form-input { width: 100%; padding: 9px 12px; border: 1px solid var(--border-color, #d1d5db); border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    .form-input:focus { outline: none; border-color: var(--primary, #3b82f6); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .form-select { width: 100%; padding: 9px 12px; border: 1px solid var(--border-color, #d1d5db); border-radius: 6px; font-size: 14px; box-sizing: border-box; background: var(--bg-input, #fff); }
    .inbox-display { padding: 8px 12px; background: var(--bg-secondary, #f9fafb); border-radius: 6px; font-size: 13px; font-family: monospace; word-break: break-all; margin-top: 6px; }
    .inbox-display.freemail { border-left: 3px solid #22c55e; }
    .inbox-display.external { border-left: 3px solid #3b82f6; }
    .inbox-display.none { border-left: 3px solid #ef4444; color: #991b1b; }
    .inbox-type-badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-left: 8px; }
    .badge-freemail { background: #dcfce7; color: #166534; }
    .badge-external { background: #dbeafe; color: #1e40af; }
    .badge-none { background: #fee2e2; color: #991b1b; }
    .status-indicator { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #9ca3af; }
    .status-dot.active { background: #3b82f6; animation: pulse 1.5s infinite; }
    .status-dot.success { background: #22c55e; }
    .status-dot.error { background: #ef4444; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
    .progress-bar { width: 100%; height: 6px; background: var(--bg-secondary, #e5e7eb); border-radius: 3px; overflow: hidden; margin: 10px 0; }
    .progress-fill { height: 100%; background: var(--primary, #3b82f6); transition: width 0.3s; width: 0%; }
    .error-box { padding: 10px 14px; background: #fee2e2; color: #991b1b; border-radius: 6px; font-size: 13px; margin-top: 10px; display: none; }
    .info-note { font-size: 12px; color: var(--text-secondary, #6b7280); margin-top: 6px; line-height: 1.5; }
    .btn-row { display: flex; gap: 10px; margin-top: 16px; }
    .btn-primary { flex: 1; padding: 11px; background: var(--primary, #3b82f6); color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { padding: 11px 20px; background: var(--bg-secondary, #f3f4f6); color: var(--text, #111827); border: 1px solid var(--border-color, #d1d5db); border-radius: 6px; font-size: 14px; cursor: pointer; }
    .btn-danger { padding: 11px 20px; background: #ef4444; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
    .disabled-overlay { position: relative; }
    .disabled-overlay::after { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,0.6); backdrop-filter: blur(2px); border-radius: 10px; }
    .disabled-banner { text-align: center; padding: 20px; color: #991b1b; font-weight: 600; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <span class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
      </span>
      <span>换绑邮箱</span>
    </div>
    <div class="nav-actions">
      <a href="/" class="btn btn-ghost" style="text-decoration:none"><span>返回邮箱</span></a>
      <button id="logout" class="btn btn-secondary">退出登录</button>
    </div>
  </div>

  <div class="rebind-container">
    <div id="disabled-banner" class="rebind-section" style="display:none">
      <div class="disabled-banner">⚠️ 换绑服务未配置或未启用，请联系管理员</div>
    </div>

    <!-- 第一段：账号信息 -->
    <div class="rebind-section" id="section-account">
      <div class="rebind-section-title"><span class="step-num">1</span>账号信息</div>
      <div class="form-group">
        <label class="form-label">旧邮箱（当前 ChatGPT 绑定邮箱）</label>
        <input id="old-email" class="form-input" type="email" placeholder="user@example.com" autocomplete="off" />
        <div id="old-inbox-display" class="inbox-display" style="display:none"></div>
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input id="password" class="form-input" type="password" placeholder="ChatGPT 账号密码" autocomplete="off" />
      </div>
      <div class="form-group">
        <label class="form-label">TOTP 密钥（Base32，如已开启两步验证）</label>
        <input id="totp" class="form-input" type="text" placeholder="JBSWY3DPEHPK3PXP" autocomplete="off" />
      </div>
    </div>

    <!-- 第二段：目标邮箱 -->
    <div class="rebind-section" id="section-target">
      <div class="rebind-section-title"><span class="step-num">2</span>目标邮箱</div>
      <div class="form-group">
        <label class="form-label">新邮箱</label>
        <select id="new-email" class="form-select">
          <option value="">加载中…</option>
        </select>
        <div class="info-note">从您有权限的邮箱中选择。支持 freemail 托管邮箱和外部接码邮箱。</div>
        <div id="new-inbox-display" class="inbox-display" style="display:none"></div>
      </div>
    </div>

    <!-- 第三段：任务状态 -->
    <div class="rebind-section" id="section-status" style="display:none">
      <div class="rebind-section-title"><span class="step-num">3</span>任务状态</div>
      <div class="status-indicator">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text" style="font-size:14px;font-weight:500">等待中</span>
      </div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <div id="error-box" class="error-box"></div>
      <div class="btn-row">
        <button id="btn-cancel" class="btn-danger" style="display:none">取消任务</button>
      </div>
    </div>

    <div class="btn-row" id="submit-row">
      <button id="btn-submit" class="btn-primary">开始换绑</button>
    </div>
  </div>

  <div id="footer-slot"></div>
  <script src="/js/toast-utils.js"></script>
  <script type="module">
    import { apiFetch } from '/js/api.js';

    const oldEmailInput = document.getElementById('old-email');
    const newEmailSelect = document.getElementById('new-email');
    const passwordInput = document.getElementById('password');
    const totpInput = document.getElementById('totp');
    const btnSubmit = document.getElementById('btn-submit');
    const btnCancel = document.getElementById('btn-cancel');
    const sectionStatus = document.getElementById('section-status');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const progressFill = document.getElementById('progress-fill');
    const errorBox = document.getElementById('error-box');
    const oldInboxDisplay = document.getElementById('old-inbox-display');
    const newInboxDisplay = document.getElementById('new-inbox-display');
    const disabledBanner = document.getElementById('disabled-banner');
    const sectionAccount = document.getElementById('section-account');
    const sectionTarget = document.getElementById('section-target');
    const submitRow = document.getElementById('submit-row');

    let currentTaskId = null;
    let pollTimer = null;
    let serviceEnabled = false;

    // 从 URL 参数读取 new_email
    const urlParams = new URLSearchParams(window.location.search);
    const prefillNewEmail = urlParams.get('new_email');

    // 检查服务配置
    async function checkConfig() {
      try {
        const data = await apiFetch('/api/rebind/config');
        serviceEnabled = data.enabled;
        if (!serviceEnabled) {
          disabledBanner.style.display = '';
          sectionAccount.classList.add('disabled-overlay');
          sectionTarget.classList.add('disabled-overlay');
          submitRow.style.display = 'none';
        }
      } catch (_) {
        serviceEnabled = false;
        disabledBanner.style.display = '';
        submitRow.style.display = 'none';
      }
    }

    // 加载用户邮箱列表
    async function loadMailboxes() {
      try {
        const data = await apiFetch('/api/mailboxes');
        const mailboxes = data.mailboxes || data.items || [];
        newEmailSelect.innerHTML = '';
        if (mailboxes.length === 0) {
          newEmailSelect.innerHTML = '<option value="">暂无可用邮箱</option>';
          return;
        }
        for (const mb of mailboxes) {
          const addr = mb.address || mb.email;
          const opt = document.createElement('option');
          opt.value = addr;
          opt.textContent = addr;
          newEmailSelect.appendChild(opt);
        }
        // 预填
        if (prefillNewEmail) {
          const exists = Array.from(newEmailSelect.options).some(o => o.value === prefillNewEmail);
          if (exists) {
            newEmailSelect.value = prefillNewEmail;
          } else {
            // 不在列表中，添加一个选项
            const opt = document.createElement('option');
            opt.value = prefillNewEmail;
            opt.textContent = prefillNewEmail + '（外部邮箱）';
            newEmailSelect.insertBefore(opt, newEmailSelect.firstChild);
            newEmailSelect.value = prefillNewEmail;
          }
          updateInboxDisplay('new', prefillNewEmail);
        }
      } catch (e) {
        newEmailSelect.innerHTML = '<option value="">加载失败</option>';
      }
    }

    // 更新接码地址显示
    async function updateInboxDisplay(label, email) {
      const displayEl = label === 'old' ? oldInboxDisplay : newInboxDisplay;
      if (!email) { displayEl.style.display = 'none'; return; }
      displayEl.style.display = '';
      displayEl.textContent = '查询中…';
      displayEl.className = 'inbox-display';
      try {
        const data = await apiFetch(`/api/rebind/inbox-config?email=${encodeURIComponent(email)}`);
        const type = data.type || 'none';
        displayEl.className = `inbox-display ${type}`;
        let badge = '';
        if (type === 'freemail') badge = '<span class="inbox-type-badge badge-freemail">freemail 托管</span>';
        else if (type === 'external') badge = '<span class="inbox-type-badge badge-external">外部接码</span>';
        else badge = '<span class="inbox-type-badge badge-none">未配置</span>';
        displayEl.innerHTML = `接码方式：${badge} ${data.inbox_url || ''} ${data.description || ''}`;
      } catch (_) {
        displayEl.className = 'inbox-display none';
        displayEl.textContent = '接码地址：查询失败';
      }
    }

    oldEmailInput.addEventListener('input', () => updateInboxDisplay('old', oldEmailInput.value.trim()));
    newEmailSelect.addEventListener('change', () => updateInboxDisplay('new', newEmailSelect.value));

    // 提交任务
    btnSubmit.addEventListener('click', async () => {
      if (!serviceEnabled) { if (window.showToast) window.showToast('换绑服务未启用', 'error'); return; }
      const oldEmail = oldEmailInput.value.trim();
      const newEmail = newEmailSelect.value;
      const password = passwordInput.value;
      const totp = totpInput.value.trim();
      if (!oldEmail) { if (window.showToast) window.showToast('请输入旧邮箱', 'error'); return; }
      if (!newEmail) { if (window.showToast) window.showToast('请选择新邮箱', 'error'); return; }
      if (!password) { if (window.showToast) window.showToast('请输入密码', 'error'); return; }

      btnSubmit.disabled = true;
      btnSubmit.textContent = '提交中…';
      errorBox.style.display = 'none';

      try {
        const data = await apiFetch('/api/rebind/start', {
          method: 'POST',
          body: JSON.stringify({ old_email: oldEmail, new_email: newEmail, password, totp_secret: totp })
        });
        currentTaskId = data.task_id;
        // 清空敏感字段
        passwordInput.value = '';
        totpInput.value = '';
        // 显示状态
        sectionStatus.style.display = '';
        submitRow.style.display = 'none';
        btnCancel.style.display = '';
        startPolling();
      } catch (e) {
        errorBox.textContent = '创建任务失败：' + e.message;
        errorBox.style.display = '';
        btnSubmit.disabled = false;
        btnSubmit.textContent = '开始换绑';
      }
    });

    // 取消任务
    btnCancel.addEventListener('click', async () => {
      if (!currentTaskId) return;
      if (!confirm('确认取消换绑任务？')) return;
      try {
        await apiFetch(`/api/rebind/task/${currentTaskId}/cancel`, { method: 'POST' });
        if (window.showToast) window.showToast('已请求取消', 'success');
      } catch (e) {
        if (window.showToast) window.showToast('取消失败：' + e.message, 'error');
      }
    });

    // 轮询任务状态
    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(pollTask, 3000);
      pollTask();
    }

    async function pollTask() {
      if (!currentTaskId) return;
      try {
        const data = await apiFetch(`/api/rebind/task/${currentTaskId}`);
        const status = data.status || 'unknown';
        updateStatusUI(status, data);
        if (['success', 'failed', 'cancelled', 'expired'].includes(status)) {
          clearInterval(pollTimer);
          pollTimer = null;
          btnCancel.style.display = 'none';
          submitRow.style.display = '';
          btnSubmit.disabled = false;
          btnSubmit.textContent = '再次换绑';
        }
      } catch (_) {}
    }

    function updateStatusUI(status, data) {
      statusDot.className = 'status-dot';
      const statusMap = {
        created: { text: '任务已创建', dot: '', progress: 10 },
        running: { text: '登录中…', dot: 'active', progress: 30 },
        waiting_code: { text: '等待验证码…', dot: 'active', progress: 60 },
        success: { text: '换绑成功！', dot: 'success', progress: 100 },
        failed: { text: '换绑失败', dot: 'error', progress: 100 },
        cancelled: { text: '任务已取消', dot: 'error', progress: 100 },
        expired: { text: '任务超时', dot: 'error', progress: 100 },
      };
      const info = statusMap[status] || { text: status, dot: '', progress: 20 };
      statusText.textContent = info.text;
      statusDot.classList.add(info.dot);
      progressFill.style.width = info.progress + '%';
      if (status === 'failed' && data.error) {
        errorBox.textContent = '错误：' + data.error;
        errorBox.style.display = '';
      }
      if (data.result && data.result.message) {
        statusText.textContent += ' - ' + data.result.message;
      }
    }

    document.getElementById('logout').onclick = async () => { try { await apiFetch('/api/session/logout', { method: 'POST' }); } catch(_) {} location.href = '/'; };

    // footer
    (async function(){ try { const res = await fetch('/templates/footer.html', { cache: 'no-cache' }); const html = await res.text(); const slot = document.getElementById('footer-slot'); if (slot) slot.outerHTML = html; } catch(_){} })();

    // 初始化
    checkConfig();
    loadMailboxes();
  </script>
</body>
</html>
